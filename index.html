    function dir(pl){return pl==='W'?-1:1;}
    function homeAll(pl){var i;if(pl==='W'){if(B.barW)return false;for(i=6;i<24;i++)if(B.pts[i]>0)return false;return true;}
      if(B.barB)return false;for(i=0;i<18;i++)if(B.pts[i]<0)return false;return true;}
    function blocked(i,pl){return pl==='W'?B.pts[i]<=-2:B.pts[i]>=2;}
    function dest(pl,from,d){
      if(from==='bar'){var di=pl==='W'?(24-d):(d-1);return blocked(di,pl)?null:di;}
      if(pl==='W'&&B.barW)return null;if(pl==='B'&&B.barB)return null;
      var i=from,to=i+dir(pl)*d,k;
      if(pl==='W'){if(to>=0)return blocked(to,pl)?null:to;
        if(!homeAll('W'))return null;if(to===-1)return 'off';
        for(k=i+1;k<=5;k++)if(B.pts[k]>0)return null;return 'off';}
      if(to<=23)return blocked(to,pl)?null:to;
      if(!homeAll('B'))return null;if(to===24)return 'off';
      for(k=i-1;k>=18;k--)if(B.pts[k]<0)return null;return 'off';}
    function hasC(pl,from){if(from==='bar')return pl==='W'?B.barW>0:B.barB>0;return pl==='W'?B.pts[from]>0:B.pts[from]<0;}
    function froms(pl){var a=[],i;if(pl==='W'){if(B.barW)return ['bar'];for(i=0;i<24;i++)if(B.pts[i]>0)a.push(i);}else{if(B.barB)return ['bar'];for(i=0;i<24;i++)if(B.pts[i]<0)a.push(i);}return a;}
    function diceUniq(){var u={};B.dice.forEach(function(d){u[d]=1;});return Object.keys(u).map(Number);}
    function legalMoves(pl){var ms=[];froms(pl).forEach(function(f){diceUniq().forEach(function(d){if(!hasC(pl,f))return;var t=dest(pl,f,d);if(t!==null)ms.push({from:f,d:d,to:t});});});return ms;}
    /* --- Tournament rule: a player must play as many dice as legally possible,
       and when only one of two different dice can be played, must play the higher. --- */
    function snap(){return {pts:B.pts.slice(),barW:B.barW,barB:B.barB,offW:B.offW,offB:B.offB};}
    function sHome(S,pl){var i;if(pl==='W'){if(S.barW)return false;for(i=6;i<24;i++)if(S.pts[i]>0)return false;return true;}if(S.barB)return false;for(i=0;i<18;i++)if(S.pts[i]<0)return false;return true;}
    function sBlk(S,i,pl){return pl==='W'?S.pts[i]<=-2:S.pts[i]>=2;}
    function sDest(S,pl,from,d){
      if(from==='bar'){var di=pl==='W'?(24-d):(d-1);return sBlk(S,di,pl)?null:di;}
      if(pl==='W'&&S.barW)return null;if(pl==='B'&&S.barB)return null;
      var i=from,to=i+(pl==='W'?-d:d),k;
      if(pl==='W'){if(to>=0)return sBlk(S,to,pl)?null:to;if(!sHome(S,'W'))return null;if(to===-1)return 'off';for(k=i+1;k<=5;k++)if(S.pts[k]>0)return null;return 'off';}
      if(to<=23)return sBlk(S,to,pl)?null:to;if(!sHome(S,'B'))return null;if(to===24)return 'off';for(k=i-1;k>=18;k--)if(S.pts[k]<0)return null;return 'off';}
    function sHas(S,pl,f){if(f==='bar')return pl==='W'?S.barW>0:S.barB>0;return pl==='W'?S.pts[f]>0:S.pts[f]<0;}
    function sFroms(S,pl){var a=[],i;if(pl==='W'){if(S.barW)return['bar'];for(i=0;i<24;i++)if(S.pts[i]>0)a.push(i);}else{if(S.barB)return['bar'];for(i=0;i<24;i++)if(S.pts[i]<0)a.push(i);}return a;}
    function sApply(S,pl,from,d,to){if(from==='bar'){if(pl==='W')S.barW--;else S.barB--;}else{S.pts[from]+=pl==='W'?-1:1;}
      if(to==='off'){if(pl==='W')S.offW++;else S.offB++;}
      else{if(pl==='W'){if(S.pts[to]===-1){S.pts[to]=0;S.barB++;}S.pts[to]+=1;}else{if(S.pts[to]===1){S.pts[to]=0;S.barW++;}S.pts[to]-=1;}}}
    function cloneS(S){return {pts:S.pts.slice(),barW:S.barW,barB:S.barB,offW:S.offW,offB:S.offB};}
    function distinct(a){var u={};a.forEach(function(x){u[x]=1;});return Object.keys(u).map(Number);}
    function maxPlays(S,pl,dice){if(!dice.length)return 0;var best=0;
      distinct(dice).forEach(function(d){sFroms(S,pl).forEach(function(f){if(!sHas(S,pl,f))return;var to=sDest(S,pl,f,d);if(to===null)return;
        var S2=cloneS(S);sApply(S2,pl,f,d,to);var d2=dice.slice();d2.splice(d2.indexOf(d),1);var r=1+maxPlays(S2,pl,d2);if(r>best)best=r;});});return best;}
    function allowedMoves(pl){var base=legalMoves(pl);if(!base.length)return [];
      var mx=maxPlays(snap(),pl,B.dice);
      var res=base.filter(function(m){var S=snap();sApply(S,pl,m.from,m.d,m.to);var d2=B.dice.slice();d2.splice(d2.indexOf(m.d),1);return 1+maxPlays(S,pl,d2)===mx;});
      if(mx===1){var u=distinct(B.dice);if(u.length===2){var hi=Math.max(u[0],u[1]);var hiM=res.filter(function(m){return m.d===hi;});if(hiM.length)res=hiM;}}
      return res;}
    function refreshAllowed(){B.allowed=(B.turn==='W'&&B.rolled&&!B.over)?allowedMoves('W'):[];}
    /* --- Position evaluation + full-turn lookahead for the Hard bot --- */
    function pip(S,pl){var t=0,i;if(pl==='W'){t+=S.barW*25;for(i=0;i<24;i++)if(S.pts[i]>0)t+=S.pts[i]*(i+1);}else{t+=S.barB*25;for(i=0;i<24;i++)if(S.pts[i]<0)t+=(-S.pts[i])*(24-i);}return t;}
    function blotRisk(S,pl,i){var opp=pl==='W'?'B':'W',shots=0,d;for(d=1;d<=6;d++){var j=pl==='W'?i-d:i+d;
      if(j>=0&&j<24){if(opp==='B'&&S.pts[j]<0)shots++;if(opp==='W'&&S.pts[j]>0)shots++;}
      if(opp==='B'&&S.barB>0&&pl==='W'&&i===d-1)shots++;if(opp==='W'&&S.barW>0&&pl==='B'&&i===24-d)shots++;}
      return shots*shots*0.6+shots*1.5;}
    function madePoints(S,pl){var n=0,i;for(i=0;i<24;i++){if(pl==='W'&&S.pts[i]>=2)n++;if(pl==='B'&&S.pts[i]<=-2)n++;}return n;}
    function evalPos(S,pl){var opp=pl==='W'?'B':'W',v=0,i;
      v+=pip(S,opp)-pip(S,pl);
      v+=(pl==='W'?S.offW:S.offB)*12; v-=(pl==='W'?S.offB:S.offW)*12;
      v-=(pl==='W'?S.barW:S.barB)*8;
      for(i=0;i<24;i++){var c=S.pts[i];if(pl==='W'&&c===1)v-=blotRisk(S,'W',i);if(pl==='B'&&c===-1)v-=blotRisk(S,'B',i);}
      v+=madePoints(S,pl)*2; return v;}
    function bestSequenceHard(pl){var mxAll=maxPlays(snap(),pl,B.dice);if(mxAll===0)return [];
      if(mxAll===1){var am=allowedMoves(pl),b=null,bv=-1e9;am.forEach(function(m){var S=snap();sApply(S,pl,m.from,m.d,m.to);var v=evalPos(S,pl)+Math.random()*0.01;if(v>bv){bv=v;b=[m];}});return b||[];}
      var best=null,bestVal=-1e9,nodes={n:0};
      function rec(S,dice,moves){if(nodes.n++>20000)return;var child=0;
        distinct(dice).forEach(function(d){sFroms(S,pl).forEach(function(f){if(!sHas(S,pl,f))return;var to=sDest(S,pl,f,d);if(to===null)return;child++;var S2=cloneS(S);sApply(S2,pl,f,d,to);var dd=dice.slice();dd.splice(dd.indexOf(d),1);rec(S2,dd,moves.concat([{from:f,d:d,to:to}]));});});
        if(child===0&&moves.length===mxAll){var v=evalPos(S,pl)+Math.random()*0.01;if(v>bestVal){bestVal=v;best=moves;}}}
      rec(snap(),B.dice.slice(),[]);
      if(best)return best;var am=allowedMoves(pl);return am.length?am.slice(0,1):[];}
    function applyMove(pl,from,d){var to=dest(pl,from,d);if(to===null)return false;
      if(from==='bar'){if(pl==='W')B.barW--;else B.barB--;}else{B.pts[from]+=pl==='W'?-1:1;}
      if(to==='off'){if(pl==='W')B.offW++;else B.offB++;}
      else{if(pl==='W'){if(B.pts[to]===-1){B.pts[to]=0;B.barB++;}B.pts[to]+=1;}else{if(B.pts[to]===1){B.pts[to]=0;B.barW++;}B.pts[to]-=1;}}
      var k=B.dice.indexOf(d);if(k>=0)B.dice.splice(k,1);
      if(B.offW===15){B.over=true;}if(B.offB===15){B.over=true;}
      return true;}
    function rollDice(){var a=1+(Math.random()*6|0),b=1+(Math.random()*6|0);B.dice=a===b?[a,a,a,a]:[a,b];B.rolled=true;}
    function computeSelDests(){B.selDests={};if(B.sel===null)return;
      B.allowed.forEach(function(m){if(m.from!==B.sel)return;var key=(m.to==='off')?'off':String(m.to);
        if(B.selDests[key]===undefined||(key==='off'&&m.d===(B.sel+1)))B.selDests[key]=m.d;});}
    function humanRoll(){if(B.turn!=='W'||B.rolled||B.over)return;rollDice();B.turnStart=snap2();refreshAllowed();
      B.msg=B.allowed.length?'Your move.':'No legal moves — tap End turn.';render();saveBG();}
    function afterWhiteMove(){B.sel=null;B.selDests={};if(B.over){endGame();return;}
      if(B.dice.length===0){toAI();return;}
      refreshAllowed();if(!B.allowed.length)B.msg='No more moves — tap End turn.';render();saveBG();}
    function toAI(){B.turn='B';B.dice=[];B.rolled=false;B.sel=null;B.selDests={};B.allowed=[];B.turnStart=null;B.msg='Bot is thinking…';render();aiT=setTimeout(aiStart,650);}
    function aiStart(){rollDice();B.msg='Bot rolled '+B.dice.slice(0,2).join(' & ')+'.';
      B.aiPlan=(difficulty==='Hard')?bestSequenceHard('B'):null;render();aiT=setTimeout(aiStep,700);}
    function aiStep(){if(B.over){endGame();return;}
      var mv=null;
      if(B.aiPlan){if(!B.aiPlan.length){toHuman();return;}mv=B.aiPlan.shift();}
      else{var ms=allowedMoves('B');if(!ms.length||B.dice.length===0){toHuman();return;}
        if(difficulty==='Easy'){mv=ms[(Math.random()*ms.length)|0];}
        else{var best=ms[0],bestS=-1e9;ms.forEach(function(m){var s=scoreAI(m);if(s>bestS){bestS=s;best=m;}});mv=best;}}
      if(!mv){toHuman();return;}
      applyMove('B',mv.from,mv.d);render();
      if(B.over){endGame();return;}
      aiT=setTimeout(aiStep,600);}
    function toHuman(){B.turn='W';B.dice=[];B.rolled=false;B.sel=null;B.selDests={};B.allowed=[];B.turnStart=null;B.msg='Your roll.';render();saveBG();}
    function winType(winner){var loserOff=winner==='W'?B.offB:B.offW;if(loserOff>0)return 1;var i,bg=false;
      if(winner==='W'){if(B.barB>0)bg=true;else for(i=0;i<6;i++)if(B.pts[i]<0){bg=true;break;}}
      else{if(B.barW>0)bg=true;else for(i=18;i<24;i++)if(B.pts[i]>0){bg=true;break;}}
      return bg?3:2;}
    function endGame(){if(aiT){clearTimeout(aiT);aiT=null;}var winner=B.offW===15?'W':'B';var pts=winType(winner);
      if(winner==='W')matchYou+=pts;else matchBot+=pts;B.over=true;B.turnStart=null;B.winInfo={winner:winner,pts:pts};
      var matchOver=(matchYou>=TARGET||matchBot>=TARGET);
      if(matchOver){Stats.rec('backgammon',{win:matchYou>=TARGET});Store.del('save.backgammon');haptic(winBuzz);announce(matchYou>=TARGET?'Match won!':'Match lost.');}
      else{haptic(winner==='W'?winBuzz:loseBuzz);announce(winner==='W'?'You win the game.':'Bot wins the game.');saveBG();}
      render();}
    function scoreAI(m){var s=Math.random()*0.5;
      if(m.to==='off')return 120+s;var to=m.to;
      if(B.pts[to]===1)s+=60; if(B.pts[to]===-1)s+=22; if(B.pts[to]<=-2)s+=8;
      s+=to*0.5; if(typeof m.from==='number'&&m.from<=5)s+=10; if(m.from==='bar')s+=15; return s;}
    function tapPt(ptStr){if(B.over||B.turn!=='W'||!B.rolled)return;
      var isNum=(ptStr!=='bar'&&ptStr!=='off');
      if(B.sel===null){
        var src=(ptStr==='bar')?'bar':(isNum?parseInt(ptStr,10):null);if(src===null)return;
        if(!B.allowed.some(function(m){return m.from===src;}))return;
        B.sel=src;computeSelDests();render();return;}
      var key=isNum?String(parseInt(ptStr,10)):ptStr;
      if(B.selDests[key]!==undefined){applyMove('W',B.sel,B.selDests[key]);afterWhiteMove();return;}
      if(isNum){var s2=parseInt(ptStr,10);if(B.allowed.some(function(m){return m.from===s2;})){B.sel=s2;computeSelDests();render();return;}}
      if(ptStr==='bar'&&B.allowed.some(function(m){return m.from==='bar';})){B.sel='bar';computeSelDests();render();return;}
      B.sel=null;B.selDests={};render();}
    function checkersHTML(n,pl){var h='',show=Math.min(n,5);for(var k=0;k<show;k++){var lbl=(k===show-1&&n>5)?'<span class="bg-cnt">'+n+'</span>':'';h+='<div class="bg-chk '+pl+'">'+lbl+'</div>';}return h;}
    function srcOK(idx){return B.sel===null&&B.turn==='W'&&B.rolled&&!B.over&&B.allowed.some(function(m){return m.from===idx;});}
    function pointHTML(idx,isTop){var v=B.pts[idx],pl=v>0?'w':(v<0?'b':''),n=Math.abs(v);
      var cls='bg-point '+(isTop?'top':'bottom');
      if(B.sel!==null&&B.selDests[String(idx)]!==undefined)cls+=' dst';
      if(B.sel===idx)cls+=' selp'; if(srcOK(idx))cls+=' src';
      return '<div class="'+cls+'" data-pt="'+idx+'">'+checkersHTML(n,pl)+'</div>';}
    function quadHTML(list,isTop){return list.map(function(i){return pointHTML(i,isTop);}).join('');}
    function barHTML(isTop){var n=isTop?B.barB:B.barW,pl=isTop?'b':'w',cls='bg-barslot '+(isTop?'top':'bottom');
      if(!isTop){if(B.sel==='bar')cls+=' selp';
        if(B.sel===null&&B.turn==='W'&&B.rolled&&!B.over&&B.allowed.some(function(m){return m.from==='bar';}))cls+=' src';}
      return '<div class="'+cls+'" data-pt="bar">'+checkersHTML(n,pl)+'</div>';}
    function diceHTML(){if(!B.rolled||!B.dice.length)return '';var h='<span class="bg-dice">';B.dice.forEach(function(d){h+='<span class="bg-die">'+d+'</span>';});return h+'</span>';}
    function rollBtn(){if(B.over||B.turn!=='W')return '';if(!B.rolled)return ' <button class="bg-roll" data-bgaction="roll">Roll</button>';
      var undo=(B.turnStart&&B.dice.length<B.turnStart.dice.length)?' <button class="bg-roll" data-bgaction="undo">↩ Undo</button>':'';
      if(!B.allowed.length)return undo+' <button class="bg-roll" data-bgaction="endturn">End turn</button>';return undo;}
    function render(){
      var top='<div class="bg-half top">'+quadHTML([12,13,14,15,16,17],true)+barHTML(true)+quadHTML([18,19,20,21,22,23],true)+'</div>';
      var bot='<div class="bg-half bottom">'+quadHTML([11,10,9,8,7,6],false)+barHTML(false)+quadHTML([5,4,3,2,1,0],false)+'</div>';
      var offB='<div class="bg-off top"><div class="bg-offnum">'+B.offB+'</div><div class="bg-offlabel">Bot</div></div>';
      var offW='<div class="bg-off bottom'+(B.selDests['off']!==undefined?' dst':'')+'" data-pt="off"><div class="bg-offlabel">You</div><div class="bg-offnum">'+B.offW+'</div></div>';
      var board='<div class="bg-board" role="group" aria-label="Backgammon board"><div class="bg-main">'+top+bot+'</div><div class="bg-offcol">'+offB+offW+'</div></div>';
      app.innerHTML='<div class="bg"><div class="bar"><button class="back" data-nav="menu">← Menu</button>'
        +'<div class="stats"><div class="chip"><div class="cv">'+matchYou+'</div><div class="cl">You</div></div>'
        +'<div class="chip"><div class="cv">'+matchBot+'</div><div class="cl">Bot</div></div></div>'
        +'<button class="pausebtn" data-bgaction="new" title="New game" aria-label="New game">↻</button></div>'
        +'<div class="bg-status">'+B.msg+diceHTML()+rollBtn()+'</div>'
        +board+overlayHTML()
        +'</div>';}
    function overlayHTML(){if(!B.over)return '';var wi=B.winInfo||{winner:'B',pts:1};
      var names={1:'Single game',2:'Gammon',3:'Backgammon'};var youWon=wi.winner==='W';
      var matchOver=(matchYou>=TARGET||matchBot>=TARGET);
      var title=matchOver?(matchYou>=TARGET?'Match won<em>!</em>':'Match lost<em>.</em>'):(youWon?'You win<em>!</em>':'Bot wins<em>.</em>');
      var sub=names[wi.pts]+' · +'+wi.pts+' pt'+(wi.pts>1?'s':'')+'<br>Match to '+TARGET+': You '+matchYou+' – '+matchBot+' Bot';
      return '<div class="overlay '+(youWon?'win':'')+'"><div><div class="ot">'+title+'</div><div class="os">'+sub+'</div>'
        +'<button class="osmall" data-bgaction="'+(matchOver?'strength':'new')+'">'+(matchOver?'New match':'Next game')+'</button>'
        +(matchOver?'':'<button class="osmall ghost" data-bgaction="strength">Change strength</button>')+'</div></div>';}
    function mountStart(){B.screen='start';if(aiT){clearTimeout(aiT);aiT=null;}
      app.innerHTML='<div class="start"><div class="gtop"><button class="back" data-nav="menu">← Menu</button><span></span></div>'
        +'<div class="kicker">Roll & Bear Off</div><h1 class="title" style="font-size:clamp(34px,9vw,60px)">Back<em>gam</em>mon</h1>'
        +'<p class="subtitle">Play a match to '+TARGET+' against the bot.</p>'
        +statsLine('backgammon',{})
        +'<div class="label">Opponent strength</div><div class="diffs">'
        +LEVELS.map(function(L,idx){var dot='';for(var i=0;i<4;i++)dot+='<i class="'+(i<=idx+1?'f':'')+'"></i>';
          return '<button class="diff'+(difficulty===L.k?' on':'')+'" data-bglevel="'+L.k+'"><span class="dot">'+dot+'</span><span class="dn">'+L.k+'</span><span class="dd">'+L.d+'</span></button>';}).join('')
        +'</div></div>';}
    function clickH(e){
      var lv=e.target.closest('[data-bglevel]');if(lv){difficulty=lv.dataset.bglevel;Store.set('settings.backgammon',{difficulty:difficulty});matchYou=0;matchBot=0;B.screen='play';setup();render();saveBG();return;}
      var act=e.target.closest('[data-bgaction]');if(act){var a=act.dataset.bgaction;
        if(a==='roll')humanRoll();else if(a==='endturn')toAI();else if(a==='undo')undoTurn();
        else if(a==='strength'){mountStart();}
        else if(a==='new'){if(!B.over&&!confirmNew(true))return;if(aiT)clearTimeout(aiT);if(matchYou>=TARGET||matchBot>=TARGET){matchYou=0;matchBot=0;}setup();render();saveBG();}return;}
      var pt=e.target.closest('[data-pt]');if(pt){tapPt(pt.dataset.pt);return;}}
    return {mount:function(root){app=root;app.addEventListener('click',clickH);
        var sv=Store.get('save.backgammon',null);
        if(sv&&sv.pts&&sv.pts.length===24){difficulty=sv.difficulty||difficulty;matchYou=sv.matchYou||0;matchBot=sv.matchBot||0;
          B.pts=sv.pts;B.barW=sv.barW;B.barB=sv.barB;B.offW=sv.offW;B.offB=sv.offB;B.dice=sv.dice||[];B.rolled=!!sv.rolled;B.turn='W';B.over=false;B.winInfo=null;B.aiPlan=null;B.sel=null;B.selDests={};B.turnStart=B.rolled?snap2():null;B.screen='play';
          refreshAllowed();B.msg=B.rolled?(B.allowed.length?'Your move.':'No legal moves — tap End turn.'):'Vs '+difficulty+' bot · tap Roll.';render();}
        else mountStart();},
      unmount:function(){if(aiT)clearTimeout(aiT);}};
  }

  renderHome();
})();

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  var swFirst=!navigator.serviceWorker.controller;   /* no controller => first ever install */
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  /* When an updated service worker takes over, let the player know a fresh
     version is ready (skip the very first install, which has nothing to update). */
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(swFirst){swFirst=false;return;}
    if(window.arcadeToast)window.arcadeToast('Updated — refresh for the latest.');
  });
}
</script>
