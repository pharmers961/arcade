/* =====================================================================
   POCKET ARCADE — design system v2.
   Goals: legibility first (no busy backgrounds, no micro-caps type),
   soft modern surfaces, one friendly typeface (Fredoka) with Shrikhand
   reserved for the big display titles, and a true dark theme.
   Everything is token-driven so light/dark stay in sync.
   ===================================================================== */
:root{
  /* palette */
  --bg:#f4f2fc;
  --surface:#ffffff;          /* cards, boards, keys */
  --surface-2:#f3f0fa;        /* inset wells, empty slots */
  --ink:#221c3a;              /* primary text + strong grid lines */
  --muted:#5e5878;            /* secondary text (6.3:1 on white) */
  --line:rgba(34,28,58,.14);  /* thin grid lines */
  --border:rgba(34,28,58,.10);
  --primary:#6c5ce7; --primary-2:#8a7bff; --primary-deep:#5546d6;
  --pink:#ef3e8c; --teal:#0fa9a4; --amber:#f59e0b; --orange:#f4793b;
  --green:#1f9d61; --red:#e23d5b; --gold:#b97700;
  --err:#e23d5b; --err-bg:#fde3e9;
  --tint-pink:#fbe2ef; --tint-teal:#d9f2ee; --tint-gold:#fbecca; --tint-violet:#e8e3fb;
  /* legacy aliases still referenced by inline JS styles */
  --txt:var(--ink); --txt-soft:var(--muted);
  /* shape + depth */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-sm:0 1px 2px rgba(34,28,58,.05),0 3px 10px rgba(34,28,58,.07);
  --sh-md:0 2px 4px rgba(34,28,58,.04),0 12px 28px rgba(34,28,58,.10);
  --sh-lg:0 6px 16px rgba(34,28,58,.07),0 24px 56px rgba(34,28,58,.16);
  --sh-primary:0 10px 24px rgba(108,92,231,.32);
  --grad-primary:linear-gradient(135deg,#7b6bf2,#5a48dd);
  --focus:#6c5ce7;
  /* spacing + widths */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --wrap-max:520px; --play-max:720px; --play-wide:900px;
}
html.dark{
  --bg:#13111d;
  --surface:#1e1b2c;
  --surface-2:#27233a;
  --ink:#f1eefc;
  --muted:#a9a3c2;
  --line:rgba(241,238,252,.18);
  --border:rgba(241,238,252,.11);
  --primary:#8a7bff; --primary-2:#a99dff; --primary-deep:#7263f0;
  --pink:#ff6aa5; --teal:#27ccc6; --amber:#ffb649; --orange:#ff8e57;
  --green:#37c489; --red:#ff5e79; --gold:#ffc24d;
  --err:#ff5e79; --err-bg:rgba(255,94,121,.18);
  --tint-pink:rgba(255,106,165,.13); --tint-teal:rgba(39,204,198,.11);
  --tint-gold:rgba(255,182,73,.12); --tint-violet:rgba(138,123,255,.14);
  --sh-sm:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.3);
  --sh-md:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.4);
  --sh-lg:0 6px 16px rgba(0,0,0,.35),0 24px 56px rgba(0,0,0,.5);
  --sh-primary:0 10px 24px rgba(108,92,231,.45);
  --grad-primary:linear-gradient(135deg,#8d7eff,#6a58ec);
  --focus:#a99dff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);overscroll-behavior-y:none;}
body{color:var(--ink);}

@media(min-width:768px){ :root{ --wrap-max:760px; } }
@media(min-width:1024px){ :root{ --wrap-max:960px; } }

.sk-root{
  min-height:100vh;min-height:100svh;width:100%;
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:var(--bg);
  position:relative;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
}
/* Two faint colour washes give the page life without hurting legibility. */
.sk-root:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(520px 420px at 88% -6%, rgba(124,108,242,.13), transparent 65%),
    radial-gradient(480px 400px at -8% 104%, rgba(15,169,164,.11), transparent 65%),
    radial-gradient(420px 360px at 104% 96%, rgba(239,62,140,.08), transparent 60%);
}
html.dark .sk-root:before{
  background:
    radial-gradient(560px 460px at 88% -6%, rgba(138,123,255,.16), transparent 65%),
    radial-gradient(500px 420px at -8% 104%, rgba(39,204,198,.10), transparent 65%),
    radial-gradient(440px 380px at 104% 96%, rgba(255,106,165,.09), transparent 60%);
}
.sk-wrap{width:100%;max-width:var(--wrap-max);position:relative;z-index:1;}

@media(min-width:768px){
  .sk-root{ align-items:flex-start; padding-top:max(48px,env(safe-area-inset-top)); padding-bottom:56px; }
  .sk-root:has(.game),.sk-root:has(.sol),.sk-root:has(.mj),.sk-root:has(.my){
    align-items:center; padding-top:24px; padding-bottom:24px; }
}

/* ---------- Type & shared text ---------- */
.kicker{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--primary);
  background:var(--tint-violet);border-radius:var(--r-pill);padding:7px 14px;}
.title{font-family:'Shrikhand',serif;font-weight:400;font-size:clamp(52px,14vw,92px);
  line-height:.95;margin:14px 0 6px;letter-spacing:.01em;
  background:linear-gradient(118deg,var(--pink) 12%,var(--primary) 78%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;}
.title em{font-style:normal;}
.subtitle{font-weight:500;font-size:17px;color:var(--muted);margin:10px 0 30px;}
.label{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin-bottom:14px;display:flex;align-items:center;gap:12px;justify-content:center;}
.label:before,.label:after{content:"";height:2px;flex:1;max-width:56px;border-radius:2px;background:var(--line);}
.gen{font-weight:500;color:var(--muted);margin-top:18px;font-size:15px;}

/* ---------- Start screens ---------- */
.start{text-align:center;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.diffs.t3{grid-template-columns:repeat(3,1fr);}
.diff{
  border:1.5px solid var(--border);background:var(--surface);color:var(--ink);
  padding:16px;cursor:pointer;text-align:left;border-radius:var(--r-md);
  box-shadow:var(--sh-sm);position:relative;overflow:hidden;
  font-family:inherit;
  transition:transform .15s ease, box-shadow .15s ease, background .15s, border-color .15s;
}
.diff:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--primary-2);}
.diff:active{transform:scale(.97);}
.diff.on{background:var(--grad-primary);border-color:transparent;color:#fff;box-shadow:var(--sh-primary);}
.diff.on .dd{color:rgba(255,255,255,.85);}
.diff .dn{font-weight:700;font-size:19px;display:block;}
.diff .dd{font-weight:500;font-size:12.5px;color:var(--muted);margin-top:3px;display:block;}
.diff .dot{position:absolute;top:14px;right:14px;display:flex;gap:4px;}
.diff .dot i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.2;}
.diff .dot i.f{opacity:1;}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 18px;margin-bottom:18px;
  background:var(--surface);box-shadow:var(--sh-sm);text-align:left;}
.toggle .tl{font-weight:700;font-size:16px;}
.toggle .ts{font-weight:500;font-size:13px;color:var(--muted);margin-top:2px;}
.sw{width:52px;height:30px;border-radius:var(--r-pill);background:var(--surface-2);position:relative;
  cursor:pointer;transition:background .2s;flex:none;border:1.5px solid var(--border);}
.sw.on{background:var(--primary);border-color:var(--primary);}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s cubic-bezier(.2,.9,.2,1);}
.sw.on i{left:25px;}
.play-btn{width:100%;border:none;color:#fff;font-family:inherit;font-weight:700;
  font-size:17px;padding:17px;border-radius:var(--r-md);cursor:pointer;letter-spacing:.02em;
  background:var(--grad-primary);box-shadow:var(--sh-primary);
  transition:transform .15s, box-shadow .15s, filter .15s;}
.play-btn:hover{transform:translateY(-2px);filter:brightness(1.06);}
.play-btn:active{transform:scale(.98);}
.play-btn:disabled{opacity:.6;cursor:default;transform:none;}

/* ---------- Game chrome ---------- */
.game{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;}
.boardwrap{position:relative;width:100%;margin:0 auto;
  max-width:min(100%,calc(100vh - 230px));
  max-width:min(100%,calc(100svh - 230px));}
.bar,.sol-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 22px;}
.back{background:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.02em;color:var(--muted);display:flex;align-items:center;gap:6px;padding:8px 4px;margin-left:-4px;
  transition:color .15s;}
.back:hover{color:var(--primary);}
.skip-btn{background:none;border:1.5px solid var(--border);border-radius:var(--r-md);cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;
  letter-spacing:.02em;color:var(--muted);display:flex;align-items:center;gap:5px;padding:6px 10px;
  transition:color .15s,border-color .15s;}
.skip-btn:hover{color:var(--primary);border-color:var(--primary);}
.stats{display:flex;gap:8px;align-items:center;}
.chip{border:1.5px solid var(--border);border-radius:var(--r-md);padding:7px 13px;text-align:center;
  background:var(--surface);box-shadow:var(--sh-sm);min-width:62px;}
.chip .cv{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink);}
.chip .cl{font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.chip.err{border-color:var(--err);}
.chip.err .cv{color:var(--err);}
.pausebtn{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--r-md);cursor:pointer;
  width:40px;height:40px;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-sm);font-family:inherit;font-weight:700;
  transition:transform .12s,box-shadow .12s,border-color .12s;flex:none;}
.pausebtn:hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:var(--primary-2);}
.pausebtn:active{transform:scale(.94);}
@media(pointer:coarse){
  .back,.osmall,.pick{min-height:44px;}
  .pausebtn{width:44px;height:44px;}
}

/* ---------- Sudoku ---------- */
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-md);aspect-ratio:1;}
.cell{position:relative;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:clamp(20px,6.6vw,30px);cursor:pointer;user-select:none;
  background:transparent;transition:background .12s;}
.cell .v{line-height:1;}
.cell .v.pp{animation:pop .2s ease;}
.cell.given{color:var(--ink);font-weight:700;}
.cell.user{color:var(--primary);font-weight:700;}
.cell.hintv{color:var(--gold);font-weight:700;}
.cell.bad{color:var(--err)!important;}
.cell.peer{background:rgba(108,92,231,.07);}
.cell.same{background:rgba(15,169,164,.18);}
.cell.sel{background:rgba(108,92,231,.16);box-shadow:inset 0 0 0 2.5px var(--primary);}
.cell.badbg{background:var(--err-bg);}
.cell.hintpulse{animation:hintp 1.1s ease 2;}
html.dark .cell.peer{background:rgba(138,123,255,.10);}
html.dark .cell.same{background:rgba(39,204,198,.22);}
html.dark .cell.sel{background:rgba(138,123,255,.20);}
.notes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);padding:2px;}
.notes span{font-weight:500;font-size:10px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);line-height:1;}

.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin-top:18px;}
.num{position:relative;aspect-ratio:1;border:1.5px solid var(--border);background:var(--surface);
  border-radius:var(--r-sm);font-family:inherit;font-weight:700;font-size:clamp(18px,5vw,22px);
  color:var(--ink);cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .12s, box-shadow .12s, border-color .12s;
  display:flex;align-items:center;justify-content:center;}
.num:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--primary-2);}
.num:active{transform:scale(.93);}
.num.done{opacity:.3;pointer-events:none;}
.num .rem{position:absolute;bottom:2px;right:5px;font-weight:500;font-size:9.5px;color:var(--muted);}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.tools.t4{grid-template-columns:repeat(4,1fr);}
.tool{border:1.5px solid var(--border);border-radius:var(--r-md);padding:11px 8px;cursor:pointer;
  background:var(--surface);box-shadow:var(--sh-sm);font-family:inherit;font-weight:700;
  font-size:12px;letter-spacing:.02em;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .12s,box-shadow .12s,background .15s,color .15s,border-color .15s;}
.tool span.ic{font-size:17px;line-height:1;}
.tool:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--primary-2);}
.tool:active{transform:scale(.96);}
.tool.on{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:var(--sh-primary);}
.tool.on .badge{color:rgba(255,255,255,.85);}
.tool .badge{font-weight:500;font-size:10px;letter-spacing:0;text-transform:none;color:var(--muted);}
.tool[disabled],.tool.disabled{opacity:.4;pointer-events:none;}
.ms-tools,.mj-tools,.my-tools{display:flex;gap:10px;margin-top:14px;}
.ms-tools .tool,.mj-tools .tool,.my-tools .tool{flex:1;}
.zip-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
@media(max-width:430px){
  .tools{gap:8px;}
  .tools.t4{gap:7px;}
  .tools.t4 .tool{padding:10px 3px;}
  .pad{gap:6px;margin-top:16px;}
}
@media(min-width:768px){
  .pad{margin-top:16px;}
  .tools,.ms-tools,.mj-tools,.zip-tools,.my-tools{margin-top:12px;}
  .tool{padding:9px 8px;gap:4px;}
}

/* ---------- Overlays, dialogs & small buttons ---------- */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(244,242,252,.82);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  border-radius:var(--r-lg);z-index:5;text-align:center;padding:24px;}
html.dark .overlay{background:rgba(19,17,29,.84);}
.overlay .ot{font-weight:700;font-size:32px;color:var(--ink);letter-spacing:.01em;}
.overlay .ot em{font-style:normal;color:var(--primary);}
.win .ot{color:var(--green);}
.win .ot em{color:var(--green);}
.overlay .os{font-weight:500;color:var(--muted);margin:10px 0 22px;font-size:16px;}
.osmall{border:none;background:var(--grad-primary);padding:13px 26px;border-radius:var(--r-pill);cursor:pointer;
  font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.02em;color:#fff;
  box-shadow:var(--sh-primary);transition:transform .12s,filter .12s;}
.osmall:hover{transform:translateY(-2px);filter:brightness(1.06);}
.osmall:active{transform:scale(.96);}
.osmall.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);box-shadow:var(--sh-sm);}
.osmall[disabled]{opacity:.45;cursor:default;transform:none;}
.overlay.modal{position:fixed;inset:0;z-index:60;border-radius:0;background:rgba(34,28,58,.45);}
html.dark .overlay.modal{background:rgba(0,0,0,.6);}
.accbox{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:22px;max-width:380px;width:92%;text-align:center;
  max-height:88vh;overflow:auto;color:var(--ink);}
.modal .ot{font-size:23px;}
.modal .os{margin:10px 0 4px;}
.acch{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin:14px 0 8px;}
.picks{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.pick{border:1.5px solid var(--border);background:var(--surface-2);border-radius:var(--r-pill);
  padding:8px 13px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);
  transition:background .12s,border-color .12s,color .12s,transform .12s;}
.pick:hover{border-color:var(--primary-2);}
.pick:active{transform:scale(.95);}
.pick.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.accwhere{font-weight:600;font-size:13px;margin-top:14px;color:var(--muted);}
.accbtns{display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap;}

/* Help card */
.help-body{text-align:left;font-weight:500;font-size:14px;line-height:1.55;color:var(--ink);margin:12px 0 4px;}
.help-body p{margin:0 0 10px;}
.help-body .hk{font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin:14px 0 5px;}
.help-body kbd{font-family:inherit;font-weight:700;font-size:12px;border:1.5px solid var(--border);
  border-radius:6px;padding:1px 6px;background:var(--surface-2);}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);z-index:70;max-width:88vw;
  background:#221c3a;color:#fff;font-weight:600;font-size:14px;
  padding:13px 18px;border-radius:var(--r-md);box-shadow:var(--sh-lg);
  opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;
  transition:opacity .3s, transform .3s;}
html.dark .toast{background:var(--surface-2);border:1.5px solid var(--border);color:var(--ink);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast-btn{flex:none;border:none;border-radius:var(--r-pill);background:var(--primary);
  color:#fff;font-family:inherit;font-weight:700;font-size:12px;padding:8px 14px;cursor:pointer;}
.toast-btn:hover{filter:brightness(1.1);}

/* ---------- Home ---------- */
.home{text-align:center;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;}
.gamegrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:24px;}
.gcard{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--border);
  border-radius:var(--r-lg);background:var(--surface);padding:14px 16px;cursor:pointer;
  box-shadow:var(--sh-sm);font-family:inherit;color:var(--ink);
  transition:transform .15s,box-shadow .15s,border-color .15s;}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--primary-2);}
.gcard:active{transform:scale(.98);}
.gglyph{font-weight:700;font-size:24px;width:52px;height:52px;display:flex;
  align-items:center;justify-content:center;border-radius:16px;flex:none;color:#fff;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.12);}
.g-su .gglyph{background:linear-gradient(135deg,#f562a4,#e02779);}
.g-mi .gglyph{background:linear-gradient(135deg,#2cc7c2,#0d918c);}
.g-so .gglyph{background:linear-gradient(135deg,#fbbe45,#ef8d0c);color:#4a2c00;}
.g-zi .gglyph{background:linear-gradient(135deg,#ff9357,#ef5a26);}
.g-ma .gglyph{background:linear-gradient(135deg,#9d8bff,#6a52e8);}
.g-wd .gglyph{background:linear-gradient(135deg,#3cc77f,#168a51);}
.g-my .gglyph{background:linear-gradient(135deg,#ff6b81,#dc2f4e);}
.g-mind .gglyph{background:linear-gradient(135deg,#f368b6,#b831d8 );background:linear-gradient(135deg,#f368b6,#a934d6);}
.g-cross .gglyph{background:linear-gradient(135deg,#ffd34e,#f59e0b);color:#4a2c00;}
.g-crypt .gglyph{background:linear-gradient(135deg,#7fd0ff,#2f7fe0);}
.gtext{display:flex;flex-direction:column;min-width:0;}
.gname{font-weight:700;font-size:19px;}
.gdesc{font-weight:500;font-size:13px;color:var(--muted);}
.gtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.gmeta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.gbadge,.gstreak{font-weight:700;font-size:10px;letter-spacing:.04em;
  border-radius:var(--r-pill);padding:3px 9px;}
.gbadge{background:var(--tint-gold);color:var(--gold);}
.gstreak{background:var(--tint-pink);color:var(--pink);}
.gcard.gcont{background:var(--grad-primary);border-color:transparent;color:#fff;box-shadow:var(--sh-primary);grid-column:1/-1;}
.gcard.gcont .gname{color:#fff;}
.gcard.gcont .gdesc{color:rgba(255,255,255,.82);}
.gcard.gcont .gglyph{background:rgba(255,255,255,.18);box-shadow:none;}
.home-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;}
.ready-note{font-weight:600;font-size:13px;color:var(--green);margin:22px 0 0;text-align:center;}
.ready-note.off{color:var(--orange);}
.stat-line{font-weight:600;font-size:12.5px;letter-spacing:.03em;color:var(--muted);margin:-16px 0 24px;}

@media(min-width:560px){ .gamegrid{grid-template-columns:repeat(2,1fr);} }
@media(min-width:900px){ .gamegrid{grid-template-columns:repeat(3,1fr);} }
@media(min-width:431px){ .gamegrid{gap:var(--s4);margin-top:var(--s5);} .diffs{gap:var(--s4);} }
@media(min-width:900px){
  .home{display:grid;text-align:left;align-items:center;
    column-gap:var(--s6);row-gap:0;
    grid-template-columns:minmax(240px,0.85fr) 1.15fr;
    grid-template-rows:auto auto auto auto;
    grid-template-areas:"k g" "t g" "s g" "a g";}
  .home .kicker{grid-area:k;align-self:end;justify-self:start;}
  .home .title{grid-area:t;}
  .home .subtitle{grid-area:s;align-self:start;}
  .home .home-actions{grid-area:a;align-self:start;justify-content:flex-start;}
  .home .gamegrid{grid-area:g;align-self:center;margin-top:0;
    grid-template-columns:1fr 1fr;gap:var(--s3);}
  .home .gcard{padding:12px 14px;gap:12px;}
  .home .gglyph{width:46px;height:46px;font-size:21px;border-radius:14px;}
  .home .gname{font-size:17px;}
  .home .gdesc{font-size:12.5px;}
}
@media(min-width:768px){
  .title{font-size:78px;}
  .subtitle{font-size:19px;}
  .game{max-width:min(var(--play-max),calc(100svh - 250px));margin-inline:auto;}
  .game.cross,.game.crypt,.game.mind{max-width:var(--play-max);}
  .sol,.mj{max-width:var(--play-wide);margin-inline:auto;}
  .my{max-width:480px;margin-inline:auto;}
  .game .boardwrap{max-width:100%;}
}

/* ---------- Stats & settings views ---------- */
.strows{display:flex;flex-direction:column;gap:10px;margin-top:6px;text-align:left;}
.strow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);
  border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh-sm);
  padding:12px 16px;color:var(--ink);}
.strow .sg{font-weight:700;font-size:15px;flex:1;}
.strow .sv{font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;}
.strow .sv b{color:var(--primary);}
.set-theme .diff .dn{font-size:16px;}

/* ---------- Minesweeper ---------- */
.ms-board{display:grid;border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-md);background:var(--surface);}
.ms-cell{position:relative;display:flex;align-items:center;justify-content:center;
  font-weight:700;cursor:pointer;border:1px solid var(--line);
  font-size:clamp(13px,4.2vw,20px);user-select:none;}
.ms-cell.hide:nth-child(4n+1){background:var(--tint-pink);}
.ms-cell.hide:nth-child(4n+2){background:var(--tint-teal);}
.ms-cell.hide:nth-child(4n+3){background:var(--tint-gold);}
.ms-cell.hide:nth-child(4n){background:var(--tint-violet);}
.ms-cell.show{background:var(--surface);}
.ms-cell.mine{background:var(--err-bg);}
.ms-cell.boom{background:var(--err);}
.ms-cell.foc{box-shadow:inset 0 0 0 3px var(--primary);z-index:1;}
.n1{color:#2d6cdf;}.n2{color:var(--green);}.n3{color:var(--pink);}.n4{color:var(--primary);}
.n5{color:#b3621a;}.n6{color:var(--teal);}.n7{color:var(--ink);}.n8{color:var(--muted);}
html.dark .n1{color:#7aa5ff;} html.dark .n5{color:#f0a05c;}

/* ---------- Zip ---------- */
.zip-wrap{position:relative;width:min(100%,calc(100vh - 230px));
  width:min(100%,calc(100svh - 230px));margin:0 auto;}
.zip-board{position:relative;display:grid;border:1.5px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-md);aspect-ratio:1;background:var(--surface);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;}
.zip-cell{position:relative;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);}
.zip-cell.on{background:rgba(244,121,59,.15);}
html.dark .zip-cell.on{background:rgba(255,142,87,.18);}
.zip-num{position:relative;z-index:2;width:62%;aspect-ratio:1;border-radius:50%;
  background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:clamp(12px,3.6vw,20px);}
.zip-cell.first .zip-num{background:var(--orange);color:#fff;}
.zip-cell.last .zip-num{background:var(--pink);color:#fff;}
.zip-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.zip-svg polyline{fill:none;stroke:var(--orange);stroke-width:.34;stroke-linecap:round;stroke-linejoin:round;}
.zip-svg circle{fill:var(--orange);}
@keyframes zshake{0%,100%{transform:none;}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
.zip-cell.shake{animation:zshake .3s ease;background:var(--err-bg);}

/* ---------- Solitaire ---------- */
.sol{--cw:44px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
  display:flex;flex-direction:column;min-height:calc(100svh - 96px);}
.sol .ms-tools{margin-top:auto;padding-top:26px;}
.sol-top{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px;}
.sol-tableau{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:start;padding-bottom:30px;}
.sol-col{position:relative;min-height:calc(var(--cw)*1.42);}
.sol-slot{aspect-ratio:.70;border:2px dashed var(--line);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--line);
  background:var(--surface-2);}
html.dark .sol-slot{background:rgba(255,255,255,.03);color:var(--muted);}
.sol-slot.spacer{border:none;background:none;}
.sol-found{border:2px dashed rgba(108,92,231,.55);background:var(--tint-violet);
  color:var(--primary);font-size:24px;}
/* Playing cards stay light in both themes, like cards on a table. */
.card{width:100%;aspect-ratio:.70;border:1px solid rgba(34,28,58,.18);border-radius:9px;background:#fff;
  position:relative;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(20,15,40,.25);}
.sol-col .card{margin-top:calc(var(--cw)*-1.04);}
.sol-col .card:first-child{margin-top:0;}
.card.down{background:repeating-linear-gradient(45deg,#8a7bff,#8a7bff 6px,#a99dff 6px,#a99dff 12px);border-color:#6a5ae0;}
.card.red{color:#d92b56;}.card.black{color:#241e3d;}
.card .rk{position:absolute;top:3px;left:5px;line-height:1;font-size:clamp(11px,3.3vw,15px);}
.card .su{position:absolute;bottom:2px;right:5px;line-height:1;font-size:clamp(12px,3.6vw,17px);}
.card.sel{outline:3px solid var(--pink);outline-offset:-1px;box-shadow:0 0 0 4px rgba(239,62,140,.3);}

/* ---------- Mahjong ---------- */
.mj{--tw:40px;--th:calc(var(--tw)*1.5);--zo:calc(var(--tw)*0.13);animation:rise .45s cubic-bezier(.2,.8,.2,1) both;}
.mj-board{position:relative;margin:20px auto 0;width:calc(8*var(--tw) + 3*var(--zo));height:calc(4*var(--th) + 3*var(--zo));}
/* Tiles keep their light faces in dark mode (game pieces on a dark table). */
.mj-tile{position:absolute;width:var(--tw);height:var(--th);border:1px solid rgba(34,28,58,.22);border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;
  box-shadow:0 2px 4px rgba(20,15,40,.28);font-size:calc(var(--tw)*0.56);}
.mj-tile.blk{filter:brightness(.88) saturate(.85);cursor:default;}
.mj-tile.free{box-shadow:0 4px 10px rgba(20,15,40,.35);}
.mj-tile.free:hover{transform:translateY(-2px);box-shadow:0 7px 14px rgba(20,15,40,.4);}
.mj-tile.sel{outline:3px solid var(--pink);outline-offset:-1px;box-shadow:0 0 0 4px rgba(239,62,140,.35),0 4px 10px rgba(20,15,40,.35);}
.mj-tile.hintpulse{animation:hintp 1s ease 2;}
.mj-note{text-align:center;font-weight:500;color:var(--muted);min-height:18px;font-size:14px;margin-block:var(--s3);}
.c-ink{color:#241e3d;}.c-teal{color:#0fa9a4;}.c-gold{color:#b97700;}.c-pink{color:#ef3e8c;}
.c-sun{color:#f4793b;}.c-moon{color:#6c5ce7;}.c-spark{color:#1f9d61;}.c-red{color:#e23d5b;}

/* ---------- Wordle ---------- */
.wd{position:relative;max-width:480px;margin:0 auto;display:flex;flex-direction:column;}
.wd-grid{display:grid;grid-template-rows:repeat(6,1fr);gap:7px;width:100%;max-width:340px;margin:0 auto;}
.wd-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.wd-tile{aspect-ratio:1;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:clamp(22px,7vw,30px);text-transform:uppercase;}
.wd-tile.fill{border-color:var(--primary);}
.wd-tile.c{background:#0f8a4d;color:#fff;border-color:#0f8a4d;}
.wd-tile.p{background:#f5a302;color:#3b2a00;border-color:#f5a302;}
.wd-tile.a{background:#6b6580;color:#fff;border-color:#6b6580;}
html.dark .wd-tile.a{background:#3b3552;color:#b8b2cf;border-color:#3b3552;}
.wd-msg{text-align:center;min-height:20px;font-weight:700;font-size:13px;letter-spacing:.03em;
  color:var(--err);margin-block:var(--s3);text-transform:uppercase;}
.wd-kb{display:flex;flex-direction:column;gap:8px;width:100%;}
.wd-krow{display:flex;gap:6px;justify-content:center;}
.wd-key{flex:1 1 0;min-width:0;height:58px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm);
  font-family:inherit;font-weight:700;font-size:18px;text-transform:uppercase;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;transition:transform .1s,box-shadow .1s;}
.wd-key.wide{flex:1.5 1 0;font-size:12px;letter-spacing:.02em;}
.wd-key:active{transform:scale(.93);}
.wd-key.c{background:#0f8a4d;color:#fff;border-color:#0f8a4d;}
.wd-key.p{background:#f5a302;color:#3b2a00;border-color:#f5a302;}
.wd-key.a{background:#6b6580;color:#fff;border-color:#6b6580;opacity:.85;}
html.dark .wd-key.a{background:#332e49;color:#8d87a8;border-color:#332e49;}
@media(max-width:560px){
  .wd-kb{width:100vw;margin-left:calc(50% - 50vw);margin-top:auto;
    padding:0 8px max(6px,env(safe-area-inset-bottom));gap:8px;}
  .wd-krow{gap:6px;}
  .wd-key{height:64px;font-size:20px;}
}
.wd-reveal{max-width:240px;margin:10px auto 12px;}
.wd-stats{width:100%;max-width:330px;margin:6px auto 0;text-align:left;}
.wd-statnums{font-weight:500;font-size:13px;color:var(--muted);text-align:center;margin-bottom:12px;}
.wd-statnums b{color:var(--primary);font-weight:700;}
.wd-disthead{font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);margin-bottom:8px;}
.wd-distrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.wd-distn{font-weight:700;font-size:13px;width:12px;flex:none;color:var(--muted);}
.wd-distbar{display:flex;align-items:center;justify-content:flex-end;min-width:24px;height:22px;
  padding:0 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);
  font-weight:700;font-size:12px;border:1px solid var(--border);box-sizing:border-box;}
.wd-distbar.on{background:#0f8a4d;border-color:#0f8a4d;color:#fff;}

/* ---------- Mystery ---------- */
.my{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;}
.my-intro{border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);
  padding:14px 16px;box-shadow:var(--sh-sm);font-weight:500;font-size:15px;line-height:1.5;margin-bottom:16px;}
.my-cluehead,.my-gridhead{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:6px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
.my-gridhead span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px;}
.my-clues{margin:0 0 16px;padding-left:22px;font-weight:500;font-size:14px;line-height:1.55;}
.my-clues li{margin-bottom:6px;}
.my-grid{display:grid;border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  background:var(--surface);box-shadow:var(--sh-md);}
.myh{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--surface-2);font-weight:700;font-size:clamp(13px,3.6vw,18px);padding:3px 0;}
.myc{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  aspect-ratio:1;cursor:pointer;font-weight:700;font-size:clamp(13px,4vw,20px);}
.myc.v{color:var(--green);}.myc.x{color:var(--err);}
.myc.blank{background:var(--surface-2);cursor:default;}
.myc.ge,.myh.ge{border-right:2px solid var(--ink);}
.myc.gb,.myh.gb{border-bottom:2px solid var(--ink);}
.my .overlay{position:fixed;inset:0;border-radius:0;}
.my-tools .tool.accuse{background:linear-gradient(135deg,#ff6b81,#dc2f4e);color:#fff;border-color:transparent;}
.my-tools .tool.accuse .badge{color:rgba(255,255,255,.85);}

/* ---------- Mastermind ---------- */
.mm-board{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:0 auto;}
.mm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);box-shadow:var(--sh-sm);}
.mm-row.active{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(108,92,231,.18),var(--sh-sm);}
.mm-slots{display:flex;gap:9px;}
.mm-slot{width:clamp(26px,7vw,34px);aspect-ratio:1;border-radius:50%;
  border:2px dashed var(--line);background:var(--surface-2);}
.mm-slot.c1,.mm-slot.c2,.mm-slot.c3,.mm-slot.c4,.mm-slot.c5,.mm-slot.c6{border-style:solid;border-color:rgba(0,0,0,.15);}
.mm-fb{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:26px;flex:none;}
.mm-peg{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);}
.mm-peg.b{background:var(--ink);}
.mm-peg.w{background:var(--surface);}
.mm-peg.e{background:transparent;border-color:var(--line);}
.mm-pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:var(--s5);}
.mm-pick{width:clamp(36px,9vw,46px);aspect-ratio:1;padding:0;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);box-shadow:var(--sh-sm);cursor:pointer;
  transition:transform .12s, box-shadow .12s;}
.mm-pick:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.mm-pick:active{transform:scale(.92);}
.mm-ctl{width:clamp(36px,9vw,46px);aspect-ratio:1;border-radius:var(--r-md);
  border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:18px;
  cursor:pointer;box-shadow:var(--sh-sm);font-family:inherit;}
.mm-ctl:active{transform:scale(.93);}
.mm-ctl.go{background:var(--green);border-color:var(--green);color:#fff;}
.c1{background:#ef3e8c;} .c2{background:#14b8b2;} .c3{background:#fbbf24;}
.c4{background:#8b5cf6;} .c5{background:#fb7d3c;} .c6{background:#22b573;}
.mm-secret{display:flex;gap:9px;justify-content:center;margin-top:14px;}
.mm-row.answer{margin-top:10px;border-style:dashed;border-color:var(--primary-2);
  background:var(--tint-teal);box-shadow:none;position:relative;}
.mm-row.answer::before{content:'';position:absolute;left:12px;right:12px;top:-6px;height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);}
.mm-answer-tag{font-size:11px;font-weight:800;color:var(--muted);width:26px;flex:none;
  text-align:center;letter-spacing:.03em;text-transform:uppercase;}

/* ---------- Crossword ---------- */
.cw-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
  gap:0;width:100%;aspect-ratio:1;background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-md);}
.cw-cell{min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none;
  font-weight:700;font-size:clamp(20px,7vw,32px);color:var(--primary);}
.cw-cell.blk{background:var(--ink);cursor:default;}
html.dark .cw-cell.blk{background:#0c0a16;}
.cw-cell.inw{background:var(--tint-teal);}
.cw-cell.sel{background:rgba(108,92,231,.18);box-shadow:inset 0 0 0 2.5px var(--primary);}
html.dark .cw-cell.sel{background:rgba(138,123,255,.22);}
.cw-num{position:absolute;top:1px;left:3px;font-weight:600;font-size:10px;color:var(--muted);}
.cw-let{line-height:1;}
.cw-clue{display:flex;align-items:center;gap:8px;margin:var(--s4) 0 var(--s3);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);padding:8px 10px;min-height:54px;}
.cw-clue-txt{flex:1;text-align:center;font-weight:600;font-size:16px;line-height:1.3;color:var(--ink);}
.cw-clue-txt b{color:var(--primary);font-weight:700;margin-right:4px;}
.cw-clue.done{justify-content:center;font-weight:700;font-size:16px;color:var(--green);}
.cw-nav{flex:none;width:40px;height:40px;padding:0;border:none;
  border-radius:var(--r-sm);background:var(--tint-violet);color:var(--primary);
  font-size:24px;line-height:1;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:background .12s,transform .12s;}
.cw-nav:hover{background:rgba(108,92,231,.2);}
.cw-nav:active{transform:scale(.92);}
.cw-overbtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px;}
.cw-next{margin-top:var(--s4);}
.game.cross .boardwrap{max-width:min(100%, calc(100svh - 360px));}
.game.cross .wd-kb{margin-top:0;}
@media(max-width:560px){
  .game.cross .wd-kb{width:100%;margin-left:0;padding:0;}
  .game.cross .wd-key{height:50px;font-size:18px;}
}
@media(max-width:430px){
  /* the cross bar carries two chips + three buttons: slim it so nothing clips */
  .game.cross .bar{gap:8px;}
  .game.cross .stats{gap:6px;}
  .game.cross .chip{min-width:0;padding:7px 8px;}
  .game.cross .chip .cv{font-size:15px;}
  /* ↻ duplicates the Skip » button, so drop it when space is tight */
  .game.cross .bar .pausebtn[data-cwaction="new"]{display:none;}
}
@media(max-width:350px){
  .game.cross .bar{gap:6px;}
  .game.cross .bar .pausebtn{width:38px;height:38px;}
  .game.cross .skip-btn{padding:6px 7px;}
}
@media(min-width:768px){ .game.cross .boardwrap{max-width:min(440px, calc(100svh - 360px));} }

/* ---------- Cryptogram ---------- */
.cg-quote{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin:var(--s5) 0 var(--s3);}
.cg-word{display:inline-flex;}
.cg-cell{display:flex;flex-direction:column;align-items:center;width:clamp(20px,6.4vw,30px);
  padding:0;background:transparent;border:none;cursor:pointer;font-family:inherit;}
.cg-let{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:.82;
  border-bottom:2.5px solid var(--line);font-weight:700;border-radius:6px 6px 0 0;
  font-size:clamp(16px,5vw,24px);color:var(--primary);}
.cg-cip{margin-top:3px;font-weight:600;font-size:10px;letter-spacing:.04em;color:var(--muted);}
.cg-cell.lit .cg-let{background:var(--tint-teal);}
.cg-cell.sel .cg-let{background:rgba(108,92,231,.16);border-bottom-color:var(--primary);}
.cg-cell.bad .cg-let{color:var(--err);}
.cg-punct{font-weight:700;font-size:clamp(16px,5vw,24px);color:var(--muted);
  display:flex;align-items:flex-start;padding-top:2px;}
.cg-author{text-align:center;font-weight:600;font-style:italic;font-size:15px;color:var(--muted);margin-bottom:var(--s4);}
.cg-tip{text-align:center;font-weight:500;font-size:13px;color:var(--muted);margin-bottom:var(--s4);}

/* ---------- Colour-blind mode ---------- */
html.cb .wd-tile.c,html.cb .wd-key.c{background:#e05d12;border-color:#e05d12;color:#fff;}
html.cb .wd-tile.p,html.cb .wd-key.p{background:#85c0f9;border-color:#85c0f9;color:#0d2b4d;}
html.cb .wd-distbar.on{background:#e05d12;border-color:#e05d12;}
html.cb .mm-slot,html.cb .mm-pick{position:relative;}
html.cb .mm-slot::after,html.cb .mm-pick::after{position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-weight:700;
  font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65);}
html.cb .mm-slot.c1::after,html.cb .mm-pick.c1::after{content:'1';}
html.cb .mm-slot.c2::after,html.cb .mm-pick.c2::after{content:'2';}
html.cb .mm-slot.c3::after,html.cb .mm-pick.c3::after{content:'3';}
html.cb .mm-slot.c4::after,html.cb .mm-pick.c4::after{content:'4';}
html.cb .mm-slot.c5::after,html.cb .mm-pick.c5::after{content:'5';}
html.cb .mm-slot.c6::after,html.cb .mm-pick.c6::after{content:'6';}

/* ---------- Motion, cursors, confetti ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@keyframes pop{from{transform:scale(.55);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes hintp{0%,100%{box-shadow:inset 0 0 0 0 var(--amber);}50%{box-shadow:inset 0 0 0 4px var(--amber);}}
@keyframes cfall{to{transform:translateY(108vh) rotate(540deg);}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.confetti i{position:absolute;top:-14px;border-radius:2px;opacity:.95;animation:cfall linear forwards;}
.kcur{outline:3px dashed var(--primary);outline-offset:2px;position:relative;z-index:6;}
.mj-tile.kcur{outline-offset:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px;}
button:focus-visible,.gcard:focus-visible,.num:focus-visible,.tool:focus-visible,
.diff:focus-visible,.cell:focus-visible,.sw:focus-visible,.pick:focus-visible{
  outline:3px solid var(--focus);outline-offset:3px;}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;}
}

/* ---------- Phone full-height play layouts ---------- */
@media(max-width:767px){
  #screen:has(.game),#screen:has(.mj),#screen:has(.wd){
    display:flex;flex-direction:column;min-height:calc(100svh - 28px);}
  .game{flex:1;display:flex;flex-direction:column;}
  .game .pad,.game .ms-tools,.game .zip-tools{margin-top:auto;}
  .mj{flex:1;display:flex;flex-direction:column;}
  .mj .boardwrap{margin-top:auto;}
  .mj .mj-note{margin-top:auto;}
  .wd{flex:1;display:flex;flex-direction:column;}
}
@media(max-width:430px){ .mm-board{max-width:300px;} }

/* ============================================================
   THEME PALETTES — each overrides the accent colours only; the
   neutral surfaces/ink stay shared. Light + dark variants per palette.
   "violet" is the default baseline defined in :root / html.dark.
   ============================================================ */
html[data-palette="sunset"]{
  --primary:#e85d2a; --primary-2:#fb7d4c; --primary-deep:#c94d1f; --pink:#ef3e8c;
  --grad-primary:linear-gradient(135deg,#ff8a4c,#ef3e8c); --sh-primary:0 10px 24px rgba(232,93,42,.32);
  --focus:#e85d2a; --tint-violet:#ffe6d6;}
html.dark[data-palette="sunset"]{
  --primary:#ff8e57; --primary-2:#ffb07e; --primary-deep:#f4793b; --pink:#ff6aa5;
  --grad-primary:linear-gradient(135deg,#ff9a5c,#ff5e8a); --sh-primary:0 10px 24px rgba(255,142,87,.42);
  --focus:#ffb07e; --tint-violet:rgba(255,142,87,.16);}
html[data-palette="forest"]{
  --primary:#1f9d61; --primary-2:#37c489; --primary-deep:#178a52; --pink:#0fa9a4;
  --grad-primary:linear-gradient(135deg,#37c489,#0fa098); --sh-primary:0 10px 24px rgba(31,157,97,.30);
  --focus:#1f9d61; --tint-violet:#d9f2e6;}
html.dark[data-palette="forest"]{
  --primary:#37c489; --primary-2:#5fe0a6; --primary-deep:#1f9d61; --pink:#27ccc6;
  --grad-primary:linear-gradient(135deg,#43d699,#1fae9f); --sh-primary:0 10px 24px rgba(55,196,137,.40);
  --focus:#5fe0a6; --tint-violet:rgba(55,196,137,.16);}
html[data-palette="ocean"]{
  --primary:#2f7ff0; --primary-2:#5b9bff; --primary-deep:#1f63d6; --pink:#0fa9a4;
  --grad-primary:linear-gradient(135deg,#5b9bff,#2f7ff0); --sh-primary:0 10px 24px rgba(47,127,240,.30);
  --focus:#2f7ff0; --tint-violet:#dbe9ff;}
html.dark[data-palette="ocean"]{
  --primary:#5b9bff; --primary-2:#8bb8ff; --primary-deep:#2f7ff0; --pink:#27ccc6;
  --grad-primary:linear-gradient(135deg,#6ba6ff,#3a82f0); --sh-primary:0 10px 24px rgba(91,155,255,.40);
  --focus:#8bb8ff; --tint-violet:rgba(91,155,255,.16);}
html[data-palette="rose"]{
  --primary:#e0357a; --primary-2:#f25b97; --primary-deep:#c4286a; --pink:#8a5cf6;
  --grad-primary:linear-gradient(135deg,#f25b97,#d62e86); --sh-primary:0 10px 24px rgba(224,53,122,.30);
  --focus:#e0357a; --tint-violet:#fbe0ee;}
html.dark[data-palette="rose"]{
  --primary:#f25b97; --primary-2:#ff84b4; --primary-deep:#e0357a; --pink:#a99dff;
  --grad-primary:linear-gradient(135deg,#ff6fa6,#e23d8a); --sh-primary:0 10px 24px rgba(242,91,151,.40);
  --focus:#ff84b4; --tint-violet:rgba(242,91,151,.16);}
html[data-palette="mono"]{
  --primary:#3a4252; --primary-2:#5a6478; --primary-deep:#2b3240; --pink:#6b7280;
  --grad-primary:linear-gradient(135deg,#4a5468,#2b3240); --sh-primary:0 10px 24px rgba(40,46,58,.28);
  --focus:#3a4252; --tint-violet:#e8eaef;}
html.dark[data-palette="mono"]{
  --primary:#9aa4b8; --primary-2:#b8c0d0; --primary-deep:#7e889c; --pink:#8a93a6;
  --grad-primary:linear-gradient(135deg,#aab2c4,#7e889c); --sh-primary:0 10px 24px rgba(154,164,184,.30);
  --focus:#b8c0d0; --tint-violet:rgba(154,164,184,.16);}

/* ---------- Palette picker (Settings) ---------- */
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.pal{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--r-md);
  padding:12px 10px;cursor:pointer;font-family:inherit;box-shadow:var(--sh-sm);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .15s,box-shadow .15s,border-color .15s;}
.pal:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--primary-2);}
.pal:active{transform:scale(.97);}
.pal.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary),var(--sh-sm);}
.pal-sw{width:100%;height:26px;border-radius:var(--r-pill);}
.pal-name{font-weight:700;font-size:12.5px;color:var(--ink);}

/* ---------- CRT boot animation ---------- */
.crt-boot{position:fixed;inset:0;z-index:120;background:#05060a;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.crt-boot .crt-screen{position:absolute;inset:0;
  background:radial-gradient(120% 120% at 50% 50%,rgba(124,108,242,.10),transparent 70%);
  animation:crtOn 1.5s cubic-bezier(.2,.8,.2,1) forwards;}
.crt-boot .crt-line{position:absolute;left:0;right:0;top:50%;height:3px;background:#cdd6ff;
  box-shadow:0 0 16px 3px rgba(205,214,255,.9);animation:crtLine 1.5s cubic-bezier(.2,.8,.2,1) forwards;}
.crt-boot .crt-word{position:relative;font-family:'Shrikhand',serif;font-size:clamp(40px,12vw,72px);
  letter-spacing:.02em;color:transparent;background:linear-gradient(118deg,var(--pink) 12%,var(--primary) 78%);
  -webkit-background-clip:text;background-clip:text;opacity:0;animation:crtWord 1.5s ease .55s forwards;}
.crt-boot .crt-scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px);}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(3);}45%{transform:scale(1,.004);}
  70%{transform:scale(1,1);filter:brightness(1.6);}100%{transform:scale(1,1);filter:brightness(1);}}
@keyframes crtLine{0%,42%{opacity:1;transform:scaleX(.2);}55%{opacity:1;transform:scaleX(1);}
  70%{opacity:0;}100%{opacity:0;}}
@keyframes crtWord{0%{opacity:0;transform:scale(.96);}30%{opacity:1;}88%{opacity:1;}100%{opacity:0;}}

/* ---------- Coffee-break floating timer ---------- */
.cbreak{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:75;display:flex;align-items:center;gap:10px;background:#221c3a;color:#fff;
  font-weight:700;font-size:14px;padding:8px 8px 8px 14px;border-radius:var(--r-pill);
  box-shadow:var(--sh-lg);font-variant-numeric:tabular-nums;}
html.dark .cbreak{background:var(--surface-2);border:1.5px solid var(--border);color:var(--ink);}
.cbreak .cb-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);
  box-shadow:0 0 8px var(--primary);}
.cbreak .cb-count{font-weight:600;font-size:11px;opacity:.7;}
.cbreak .cb-end{border:none;border-radius:var(--r-pill);background:rgba(255,255,255,.16);
  color:inherit;font-family:inherit;font-weight:700;font-size:11px;padding:6px 11px;cursor:pointer;}
html.dark .cbreak .cb-end{background:var(--surface);}

/* ---------- Challenge / QR ---------- */
.qrbox{display:flex;justify-content:center;margin:8px 0 4px;}
.qrbox canvas{width:188px;height:188px;image-rendering:pixelated;border-radius:10px;
  border:8px solid #fff;background:#fff;box-shadow:var(--sh-sm);}
.challenge-link{font-weight:600;font-size:12px;color:var(--muted);word-break:break-all;
  background:var(--surface-2);border-radius:var(--r-sm);padding:9px 12px;margin:10px 0 4px;
  border:1.5px solid var(--border);max-height:60px;overflow:auto;}
.challenge-banner{display:flex;align-items:center;gap:10px;justify-content:center;
  font-weight:700;font-size:12.5px;color:var(--primary);background:var(--tint-violet);
  border-radius:var(--r-pill);padding:8px 14px;margin:0 auto 16px;width:fit-content;}

/* ---------- Zen mode — strip away competitive pressure ---------- */
html.zen .gstreak,html.zen .zen-hide{display:none!important;}

/* Give the coffee-break chip its own room above the content. Top-align so
   the padding isn't swallowed by the phone layout's vertical centering. */
body.cb-on .sk-root{align-items:flex-start;padding-top:max(64px,calc(env(safe-area-inset-top) + 60px));}
body.cb-on #screen:has(.game),body.cb-on #screen:has(.mj),body.cb-on #screen:has(.wd){min-height:calc(100svh - 92px);}

/* ---------- Peek: dismiss a finished-game overlay to review the board ---------- */
.overlay.peeked{display:none!important;}
.peek-fab{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:85;border:none;border-radius:var(--r-pill);background:var(--grad-primary);color:#fff;
  font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.02em;padding:13px 22px;
  box-shadow:var(--sh-primary);cursor:pointer;}
.peek-fab:hover{filter:brightness(1.06);}
.peek-fab:active{transform:translateX(-50%) scale(.96);}
</style>
</head>
<body>
<div class="sk-root"><div class="sk-wrap" id="app"></div></div>
<script>

(function(){
  var app=document.getElementById('app');
  var active=null;

  /* ============================================================
     SHARED INFRA — storage, stats, haptics, a11y live region, toast.
     All localStorage access is wrapped so private-mode / sandboxed
     browsers degrade gracefully (the games just don't remember).
     ============================================================ */
  var Store={
    get:function(k,d){try{var v=localStorage.getItem('arcade.'+k);return v==null?d:JSON.parse(v);}catch(_){return d;}},
    set:function(k,v){try{localStorage.setItem('arcade.'+k,JSON.stringify(v));}catch(_){}},
    del:function(k){try{localStorage.removeItem('arcade.'+k);}catch(_){}}
  };

  /* Global preferences: haptics on/off, theme (system/light/dark),
     colour-blind palette. Applied as classes on <html> so CSS can react. */
  var G=Store.get('settings.global',{});
  if(G.haptics==null)G.haptics=true; if(!G.theme)G.theme='system'; if(G.cb==null)G.cb=false;
  if(!G.palette)G.palette='violet'; if(G.sound==null)G.sound=false; if(G.music==null)G.music=false;
  if(G.zen==null)G.zen=false; if(G.crt==null)G.crt=true;
  function saveG(){Store.set('settings.global',G);}
  /* Each palette declares the browser-chrome colour (theme-color meta) for
     light + dark so the OS status bar / address bar matches the chosen look. */
  var PALETTES=[
    {id:'violet',name:'Violet', sw:'linear-gradient(135deg,#7b6bf2,#ef3e8c)', light:'#6c5ce7',dark:'#1a1726'},
    {id:'sunset',name:'Sunset', sw:'linear-gradient(135deg,#ff8a4c,#ef3e8c)', light:'#ef6b3c',dark:'#1f1512'},
    {id:'forest',name:'Forest', sw:'linear-gradient(135deg,#37c489,#0fa098)', light:'#1f9d61',dark:'#0e1a14'},
    {id:'ocean', name:'Ocean',  sw:'linear-gradient(135deg,#5b9bff,#2f7ff0)', light:'#2f7ff0',dark:'#0d1626'},
    {id:'rose',  name:'Rose',   sw:'linear-gradient(135deg,#f25b97,#8a5cf6)', light:'#e0357a',dark:'#1d1018'},
    {id:'mono',  name:'Mono',   sw:'linear-gradient(135deg,#5a6478,#2b3240)', light:'#3a4252',dark:'#15171c'}
  ];
  function paletteDef(id){for(var i=0;i<PALETTES.length;i++)if(PALETTES[i].id===id)return PALETTES[i];return PALETTES[0];}
  var darkMQ=null;try{darkMQ=window.matchMedia('(prefers-color-scheme: dark)');}catch(_){}
  function applyPrefs(){
    var dark=G.theme==='dark'||(G.theme==='system'&&darkMQ&&darkMQ.matches);
    document.documentElement.classList.toggle('dark',!!dark);
    document.documentElement.classList.toggle('cb',!!G.cb);
    document.documentElement.classList.toggle('zen',!!G.zen);
    document.documentElement.setAttribute('data-palette',G.palette||'violet');
    var pal=paletteDef(G.palette);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',dark?pal.dark:pal.light);
  }
  if(darkMQ){try{darkMQ.addEventListener('change',applyPrefs);}catch(_){try{darkMQ.addListener(applyPrefs);}catch(__){}}}
  applyPrefs();

  var winBuzz=[18,40,18,40,60], loseBuzz=80, tapBuzz=12;
  function haptic(p){
    /* Sound + (in Zen) softened failure feedback ride along with the central
       haptic calls, so every game gets audio with no per-game wiring. */
    if(p===tapBuzz)playSfx('tap');
    else if(p===loseBuzz){if(G.zen)return;playSfx('bad');}
    if(!G.haptics)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(_){}}
  function reducedMotion(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(_){return false;}}
  /* Confetti burst on wins — pure DOM + CSS, skipped for reduced motion. */
  function confetti(){
    if(reducedMotion())return;
    var cols=['#ef3e8c','#14b8b2','#fbbf24','#8b5cf6','#fb7d3c','#22b573'];
    var w=document.createElement('div');w.className='confetti';w.setAttribute('aria-hidden','true');
    for(var i=0;i<70;i++){var p=document.createElement('i');
      p.style.left=(Math.random()*100)+'%';
      p.style.background=cols[i%cols.length];
      p.style.animationDelay=(Math.random()*0.6)+'s';
      p.style.animationDuration=(1.6+Math.random()*1.5)+'s';
      var s=6+Math.random()*7;p.style.width=s+'px';p.style.height=(s*0.45)+'px';
      w.appendChild(p);}
    document.body.appendChild(w);
    setTimeout(function(){if(w.parentNode)w.parentNode.removeChild(w);},3900);
  }
  function winFx(){haptic(winBuzz);confetti();playSfx('win');}

  /* Visually-hidden polite live region so screen readers hear results/messages. */
  var live=document.createElement('div');
  live.setAttribute('aria-live','polite');live.setAttribute('role','status');
  live.style.cssText='position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;';
  document.body.appendChild(live);
  function announce(m){live.textContent='';setTimeout(function(){live.textContent=m;},40);}

  var Stats={
    rec:function(game,o){var s=Store.get('stats.'+game,{plays:0,wins:0,streak:0,best:null,bestScore:null});
      s.plays=(s.plays||0)+1;
      if(o&&o.win){s.wins=(s.wins||0)+1;s.streak=(s.streak||0)+1;
        if(o.time!=null&&(s.best==null||o.time<s.best))s.best=o.time;
        if(o.score!=null&&(s.bestScore==null||o.score<s.bestScore))s.bestScore=o.score;}
      else if(o&&o.win===false){s.streak=0;}
      Store.set('stats.'+game,s);return s;},
    get:function(game){return Store.get('stats.'+game,{plays:0,wins:0,streak:0,best:null,bestScore:null});}
  };
  function fmtClock(s){return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function statsLine(game,opts){var s=Stats.get(game);if(!s.plays)return '';
    var parts=[];opts=opts||{};
    if(opts.time&&s.best!=null)parts.push('Best '+fmtClock(s.best));
    if(opts.score&&s.bestScore!=null)parts.push('Best '+s.bestScore+(opts.scoreSuffix||''));
    parts.push('Won '+s.wins);
    if(s.streak>1)parts.push('Streak '+s.streak);
    return '<div class="stat-line">'+parts.join(' · ')+'</div>';}

  /* ---- App-styled modal dialogs: Escape closes, backdrop click closes,
     focus is trapped inside and restored on close. ---- */
  var modalEl=null,modalPrevFocus=null;
  function closeModal(){if(!modalEl)return;
    document.removeEventListener('keydown',modalKeyH,true);
    if(modalEl.parentNode)modalEl.parentNode.removeChild(modalEl);modalEl=null;
    if(modalPrevFocus&&modalPrevFocus.focus){try{modalPrevFocus.focus({preventScroll:true});}catch(_){}}
    modalPrevFocus=null;}
  function modalKeyH(e){if(!modalEl)return;
    e.stopPropagation(); /* keep keys away from game handlers while a dialog is open */
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){
      var f=modalEl.querySelectorAll('button:not([disabled]),[href],[tabindex]:not([tabindex="-1"])');
      if(!f.length)return;var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}

    modalPrevFocus=document.activeElement;
    var d=document.createElement('div');d.className='overlay modal';
    d.innerHTML='<div class="accbox" role="dialog" aria-modal="true">'+html+'</div>';
    document.body.appendChild(d);modalEl=d;
    d.addEventListener('click',function(e){
      if(e.target===d){closeModal();return;}
      var c=e.target.closest('[data-modal]');
      if(c){var k=c.dataset.modal;closeModal();if(opts.on&&opts.on[k])opts.on[k]();}});

    var fb=d.querySelector('[data-modal-focus]')||d.querySelector('button');
    if(fb){try{fb.focus({preventScroll:true});}catch(_){}}}

  /* Confirm before throwing away a game in progress. Calls onYes if the game
     isn't in progress, or once the player confirms in the styled dialog. */
  function confirmNew(inProgress,onYes){
    if(!inProgress){onYes();return;}
    openModal('<div class="ot">Start over?</div><div class="os">Your current game will be lost.</div>'
      +'<div class="accbtns"><button class="osmall ghost" data-modal="no" data-modal-focus>Keep playing</button>'
      +'<button class="osmall" data-modal="yes">Start over</button></div>',
      {on:{yes:onYes}});}

  function toast(msg,btnLabel,btnFn){var t=document.createElement('div');t.className='toast';
    t.appendChild(document.createTextNode(msg));
    if(btnLabel){var b=document.createElement('button');b.className='toast-btn';b.textContent=btnLabel;
      b.addEventListener('click',function(){if(btnFn)btnFn();});t.appendChild(b);t.style.pointerEvents='auto';}
    document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});
    setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},320);},btnLabel?9000:3200);}
  window.arcadeToast=toast;

  /* One-time gesture tips (long-press to flag, double-tap to foundation, …). */
  function tipOnce(k,m){if(Store.get('tip.'+k,0))return;Store.set('tip.'+k,1);
    setTimeout(function(){toast(m);},700);}

  /* ---- Share a result: native share sheet where available, else clipboard. */
  function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');}
  /* Result-overlay buttons reused across games. shareBtn() now also offers a
     "Challenge a friend" link (the top-bar one is hidden behind the overlay)
     and a "See board" peek that dismisses the overlay to review your work. */
  function peekBtnHtml(){return '<button class="osmall ghost" data-peek>👁 See board</button>';}
  function challengeBtnHtml(){return '<button class="osmall ghost" data-challenge>🔗 Challenge</button>';}
  function shareBtn(text){return '<button class="osmall ghost" data-share="'+escAttr(text)+'">Share</button>'
    +'<button class="osmall ghost" data-shareimg="'+escAttr(text)+'" aria-label="Share as image" title="Share as image">🖼</button>'
    +challengeBtnHtml()+peekBtnHtml();}
  function doShare(text){
    if(navigator.share){navigator.share({text:text}).catch(function(){});return;}
    function legacy(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('Copied to clipboard');}catch(_){toast('Couldn’t copy');}
      document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('Copied to clipboard');},legacy);}
    else legacy();}

  return this.modules[row][col];},getModuleCount:function(){return this.moduleCount;},make:function(){this.makeImpl(false,this.getBestMaskPattern());},makeImpl:function(test,maskPattern){this.moduleCount=this.typeNumber*4+17;this.modules=new Array(this.moduleCount);for(var row=0;row<this.moduleCount;row++){this.modules[row]=new Array(this.moduleCount);for(var col=0;col<this.moduleCount;col++){this.modules[row][col]=null;}}

  for(var r=-2;r<=2;r++){for(var c=-2;c<=2;c++){if(r==-2||r==2||c==-2||c==2||(r==0&&c==0)){this.modules[row+r][col+c]=true;}else{this.modules[row+r][col+c]=false;}}}}}},setupTypeNumber:function(test){var bits=QRUtil.getBCHTypeNumber(this.typeNumber);for(var i=0;i<18;i++){var mod=(!test&&((bits>>i)&1)==1);this.modules[Math.floor(i/3)][i%3+this.moduleCount-8-3]=mod;}

  /* ============================================================
     CHALLENGE LINKS + QR — encode a puzzle into the URL fragment so
     a friend opens the exact same one. No server: it all lives in
     the link. QR is rendered client-side from the embedded encoder.
     ============================================================ */
  function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function ub64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
  /* Seeded RNG (mulberry32). withSeed() temporarily routes Math.random through
     the seeded generator so a single integer reproduces a whole puzzle — most
     games are challenged with just that seed (tiny links + tidy QR codes). */
  function makeRng(seed){var s=(seed>>>0)||1;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  function withSeed(seed,fn){var prev=Math.random,r=makeRng(seed);Math.random=r;try{return fn();}finally{Math.random=prev;}}
  function randSeed(){return (Math.random()*4294967296)>>>0;}
  function challengeReceived(){toast('🔗 A friend’s challenge — same puzzle');}
  var Challenge={
    make:function(game,payload){var s=b64u(JSON.stringify({g:game,d:payload}));
      return location.origin+location.pathname+'#c='+s;},
    parse:function(hash){if(!hash)return null;var m=/[#&]c=([^&]+)/.exec(hash);if(!m)return null;
      try{var o=JSON.parse(ub64(m[1]));if(o&&o.g)return o;}catch(_){}return null;}
  };
  var pendingChallenge=null;
  function consumeChallenge(game){if(pendingChallenge&&pendingChallenge.g===game){var d=pendingChallenge.d;pendingChallenge=null;return d;}return null;}
  function drawQR(text,canvas){var m=QRMOD.build(text,'M');var n=m.getModuleCount();var q=4,sz=n+q*2;
    canvas.width=sz;canvas.height=sz;var x=canvas.getContext('2d');
    x.fillStyle='#ffffff';x.fillRect(0,0,sz,sz);x.fillStyle='#0b0a14';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m.isDark(r,c))x.fillRect(c+q,r+q,1,1);}

    var DIFF={Gentle:44,Balanced:35,Tricky:30,Fiendish:25};

  function createMines(){

    var M={screen:'start',level:'Easy',cols:9,rows:9,mines:10,grid:null,started:false,over:false,win:false,flags:0,seconds:0,flagMode:false,paused:false,focus:null,challenge:false};

    var pref=Store.get('settings.mines',null);if(pref&&LV[pref.level])M.level=pref.level;
    var fmt=function(s){return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
    function startTimer(){if(timer||M.paused)return;timer=setInterval(function(){M.seconds++;var t=document.getElementById('m_time');if(t)t.textContent=fmt(M.seconds);},1000);}
    function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
    function save(){if(M.screen==='play'&&M.started&&!M.over){Store.set('save.mines',{level:M.level,cols:M.cols,rows:M.rows,mines:M.mines,grid:M.grid,started:M.started,flags:M.flags,seconds:M.seconds,flagMode:M.flagMode});}else{Store.del('save.mines');}}
